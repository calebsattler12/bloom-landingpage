<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="bloom">
  <!-- Crisp vector recreation of the bloom wordmark (infinity oo) -->
  <g fill="#E0A0FC" fill-rule="evenodd">
    <!-- b stem -->
    <rect x="24" y="20" width="32" height="120" rx="16"/>
    <!-- b bowl -->
    <path d="M56 88c0-34 26-58 60-58s60 24 60 58-26 58-60 58-60-24-60-58zm60-30c-17 0-30 14-30 30s13 30 30 30 30-14 30-30-13-30-30-30z"/>
    <!-- l -->
    <rect x="196" y="20" width="32" height="120" rx="16"/>
    <!-- infinity oo as thick rounded stroke -->
    <path fill="none" stroke="#E0A0FC" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"
          d="M292 88c0-26 18-42 40-42 15 0 27 8 34 20 7-12 19-20 34-20 22 0 40 16 40 42s-18 42-40 42c-15 0-27-8-34-20-7 12-19 20-34 20-22 0-40-16-40-42z"/>
    <!-- punch holes in infinity rings so it reads as oo -->
    <circle cx="332" cy="88" r="18" fill="#F4EFE3"/>
    <circle cx="400" cy="88" r="18" fill="#F4EFE3"/>
    <!-- m -->
    <path d="M468 140V62c0-16 10-26 24-26s24 10 24 26v50c0-16 10-26 24-26s24 10 24 26v50c0 9-7 16-16 16s-16-7-16-16V88c0-7-4-12-10-12s-10 5-10 12v52c0 9-7 16-16 16s-16-7-16-16V88c0-7-4-12-10-12s-10 5-10 12v52c0 9-7 16-16 16s-16-7-16-16z"/>
  </g>
</svg>
