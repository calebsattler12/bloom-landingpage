<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;background:#F4EFE3}
  .frame{display:flex;align-items:center;justify-content:center;background:#F4EFE3}
  .lockup{display:flex;align-items:center;gap:0.18em;color:#E0A0FC;
    font-family:"Arial Rounded MT Bold","Arial Rounded Bold",sans-serif;font-weight:700;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;line-height:1}
  .lockup img,.lockup object,.lockup svg{display:block;height:1em;width:auto}
  .ai{font-size:0.9em;letter-spacing:0.05em;padding-top:0.06em}
  #logo400{width:400px;height:400px} #logo400 .lockup{font-size:86px}
  #logo300{width:300px;height:300px} #logo300 .lockup{font-size:64px}
  #banner{width:1584px;height:396px} #banner .lockup{font-size:176px}
  #company{width:1128px;height:191px} #company .lockup{font-size:100px}
</style>
</head>
<body>
  <div id="logo400" class="frame"><div class="lockup"><img src="bloom-wordmark.svg" alt="bloom"><span class="ai">AI</span></div></div>
  <div id="logo300" class="frame"><div class="lockup"><img src="bloom-wordmark.svg" alt="bloom"><span class="ai">AI</span></div></div>
  <div id="banner" class="frame"><div class="lockup"><img src="bloom-wordmark.svg" alt="bloom"><span class="ai">AI</span></div></div>
  <div id="company" class="frame"><div class="lockup"><img src="bloom-wordmark.svg" alt="bloom"><span class="ai">AI</span></div></div>
</body>
</html>
