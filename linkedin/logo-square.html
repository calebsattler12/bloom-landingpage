<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Bloom logo square</title>
<link rel="stylesheet" href="../brand.css">
<style>
  html, body { margin: 0; background: #fff; }
  .frame {
    width: 1200px;
    height: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .wordmark { font-size: 168px; padding-right: 0.5em; }
  .wordmark .light {
    width: 34px;
    height: 34px;
    top: 8px;
    right: 8px;
  }
  .wordmark .light::before {
    width: 110px;
    height: 110px;
  }
</style>
</head>
<body>
  <div class="frame">
    <span class="wordmark">bloom<span class="light" aria-hidden="true"></span></span>
  </div>
</body>
</html>
