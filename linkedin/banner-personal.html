<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>LinkedIn personal background</title>
<link rel="stylesheet" href="../brand.css">
<style>
  html, body { margin: 0; background: #fff; }
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: #fff;
    box-sizing: border-box;
    isolation: isolate;
  }
  .banner::before,
  .banner::after {
    content: "";
    position: absolute;
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
  }
  .banner::before {
    width: 900px;
    height: 900px;
    right: -220px;
    top: -360px;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 184, 230, 0.48) 0%,
      rgba(165, 145, 255, 0.34) 28%,
      rgba(51, 85, 255, 0.18) 52%,
      transparent 72%);
  }
  .banner::after {
    width: 520px;
    height: 520px;
    right: 180px;
    bottom: -280px;
    background: radial-gradient(circle at 50% 50%,
      rgba(51, 85, 255, 0.14) 0%,
      rgba(165, 145, 255, 0.10) 40%,
      transparent 70%);
  }
  .inner {
    position: relative;
    z-index: 1;
    height: 100%;
    box-sizing: border-box;
    padding: 44px 72px 48px 420px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    text-align: right;
  }
  .wordmark { font-size: 34px; }
  .wordmark .light { width: 10px; height: 10px; top: 2px; right: 2px; }
  p {
    margin: 0;
    font-family: Geist, system-ui, sans-serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.03em;
    color: #5E6272;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="inner">
      <span class="wordmark">bloom<span class="light" aria-hidden="true"></span></span>
      <p>Your marketing team, always on</p>
    </div>
  </div>
</body>
</html>
