<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Bloom wordmark</title>
<link rel="stylesheet" href="../brand.css">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; align-items: center; justify-content: center; }
  .wordmark { font-size: 180px; padding-right: 0.45em; }
  .wordmark .light {
    width: 36px;
    height: 36px;
    top: 8px;
    right: 8px;
  }
  .wordmark .light::before {
    width: 110px;
    height: 110px;
  }
</style>
</head>
<body>
  <span class="wordmark">bloom<span class="light" aria-hidden="true"></span></span>
</body>
</html>
