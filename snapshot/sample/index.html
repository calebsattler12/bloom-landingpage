<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DXC609MWB7"></script>
<script src="/gtag-init.js"></script>
<title>Bloom AI · Sample report</title>
<meta name="description" content="A sample Bloom AI visibility report. Company names are hidden.">
<link rel="canonical" href="https://www.runbloom.ai/snapshot/sample/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bloom AI">
<meta property="og:title" content="Bloom AI · Sample report">
<meta property="og:description" content="A sample Bloom report. Company names are hidden.">
<meta property="og:url" content="https://www.runbloom.ai/snapshot/sample/">
<meta property="og:image" content="https://www.runbloom.ai/snapshot/sample-report.jpg">
<link rel="stylesheet" href="/brand.css">
<style>
  html, body { margin: 0; background: #fff; color: #0B0B0F; }
  nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 48px;
    position: sticky;
    top: 0;
    z-index: 4;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
  }
  nav.top .nav-actions { display: flex; align-items: center; gap: 10px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
  }
  .inner {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 48px 96px;
    box-sizing: border-box;
  }
  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #3355FF;
    margin: 0 0 12px;
  }
  h1 {
    font-weight: 600;
    font-size: clamp(32px, 5vw, 48px);
    letter-spacing: -0.05em;
    line-height: 1.02;
    margin: 0;
  }
  .lede {
    margin: 16px 0 0;
    font-size: 18px;
    line-height: 1.5;
    color: #5E6272;
    max-width: 38em;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
  .btn-ink { background: #0B0B0F; color: #fff; }
  .btn-ink:hover { color: #fff; }
  .btn-ghost {
    background: #fff;
    color: #0B0B0F;
    border: 1px solid rgba(11, 11, 15, 0.16);
  }
  .report-frame {
    margin-top: 36px;
    border: 1px solid rgba(11, 11, 15, 0.10);
    border-radius: 20px;
    overflow: hidden;
    background: #F4F5F8;
  }
  .report-frame img {
    display: block;
    width: 100%;
    height: auto;
  }
  .note {
    margin-top: 14px;
    font-size: 14px;
    color: #5E6272;
  }
  @media (max-width: 860px) {
    nav.top, .inner { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
<body>
<nav class="top">
  <a href="/" aria-label="Bloom"><span class="wordmark">bloom<span class="light" aria-hidden="true"></span></span></a>
  <div class="nav-actions">
    <a class="btn btn-ghost" href="/snapshot/">Get your report</a>
    <a class="btn btn-accent" href="https://calendar.app.google/zw5FN51UGRgyidLv7" target="_blank" rel="noopener">Book a Call</a>
  </div>
</nav>
<main class="inner">
  <p class="kicker">Sample</p>
  <h1>Sample report<span class="on-light" aria-hidden="true"></span></h1>
  <p class="lede">Company names are hidden. Yours is built from your site.</p>
  <div class="actions">
    <a class="btn btn-ink" href="/snapshot/">Get your free report</a>
    <a class="btn btn-ghost" href="https://calendar.app.google/zw5FN51UGRgyidLv7" target="_blank" rel="noopener">Book a Call</a>
  </div>
  <figure class="report-frame">
    <img src="/snapshot/sample-report.jpg" alt="Sample Bloom AI visibility report with company and competitor names blurred">
  </figure>
  <p class="note">Company names in this sample are blurred on purpose.</p>
</main>
</body>
</html>
